services:
  - type: web
    name: smart-rasoi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn smart:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
